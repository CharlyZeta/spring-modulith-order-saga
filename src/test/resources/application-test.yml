spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${embedded.rabbitmq.host:localhost}
    port: ${embedded.rabbitmq.port:5672}
    username: ${embedded.rabbitmq.username:guest}
    password: ${embedded.rabbitmq.password:guest}
    listener:
      simple:
        auto-startup: false

  modulith:
    events:
      jpa:
        enabled: true

logging:
  level:
    com.showcase.ordersystem: INFO
    org.springframework.modulith: INFO

